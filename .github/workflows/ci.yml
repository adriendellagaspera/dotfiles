name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck on install.sh
        run: shellcheck install.sh

  install:
    name: Install smoke test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run installer
        run: DOTFILES_SKIP_ZSH_PLUGINS=1 bash install.sh
      - name: Verify symlinks exist
        run: |
          test -L "$HOME/.zshenv"
          test -L "$HOME/.gitignore_global"
          test -L "$HOME/.gitmessage"
          test -d "$HOME/.config/zsh/local"

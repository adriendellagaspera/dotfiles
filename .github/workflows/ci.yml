name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh scripts/*.sh home/run_*.sh tests/*.sh

  install:
    name: Chezmoi smoke test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install prerequisites
        shell: bash
        run: |
          if [ "$(uname -s)" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          curl -fsLS https://get.chezmoi.io -o "$RUNNER_TEMP/install-chezmoi.sh"
          sh "$RUNNER_TEMP/install-chezmoi.sh" -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Apply twice, preserve local settings and migrate legacy links
        run: bash tests/smoke.sh
